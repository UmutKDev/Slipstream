name: release

# "v1.2.3" biçiminde bir etiket gönderilince imzalı ve Apple onaylı
# (notarize) DMG'yi derleyip GitHub Releases'a yükler. Actions sekmesinden
# elle de çalıştırılabilir.
#
# Gerekli depo sırları (Settings > Secrets and variables > Actions):
#   MACOS_CERTIFICATE           Developer ID Application sertifikası (.p12), base64
#   MACOS_CERTIFICATE_PASSWORD  .p12 dosyasının parolası
#   APPLE_ID                    Apple geliştirici hesabının e-postası
#   APPLE_TEAM_ID               10 karakterlik ekip kimliği
#   APPLE_APP_PASSWORD          account.apple.com'dan alınan uygulamaya özel parola

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (ör. 0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KEYCHAIN: ${{ github.workspace }}/../imza.keychain-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: En yeni Xcode'u seç (Liquid Glass için Xcode 26)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Sürümü belirle
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Sürüm 1.2.3 biçiminde olmalı, gelen: $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Sırları denetle
        env:
          C: ${{ secrets.MACOS_CERTIFICATE }}
          P: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          A: ${{ secrets.APPLE_ID }}
          T: ${{ secrets.APPLE_TEAM_ID }}
          W: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=()
          [ -n "$C" ] || missing+=(MACOS_CERTIFICATE)
          [ -n "$P" ] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [ -n "$A" ] || missing+=(APPLE_ID)
          [ -n "$T" ] || missing+=(APPLE_TEAM_ID)
          [ -n "$W" ] || missing+=(APPLE_APP_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Eksik depo sırları: ${missing[*]}"; exit 1
          fi

      - name: Sertifikayı geçici anahtar zincirine yükle
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC_PASS=$(uuidgen)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$ID" ]; then
            echo "::error::Sertifikada Developer ID Application kimliği bulunamadı"; exit 1
          fi
          echo "DEVELOPER_ID=$ID" >> "$GITHUB_ENV"

      - name: Notarization bilgisini kaydet
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials slipstream-ci \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN"

      - name: İmzalı ve onaylı uygulamayı derle
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NOTARY_PROFILE: slipstream-ci
          UNIVERSAL: "1"
        run: |
          bash scripts/build-app.sh
          spctl --assess --type open --context context:primary-signature -v "build/Slipstream-$VERSION.dmg"

      - name: GitHub sürümünü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/Slipstream-$VERSION.dmg" --clobber
          else
            gh release create "$TAG" "build/Slipstream-$VERSION.dmg" \
              --title "Slipstream $VERSION" --generate-notes --target "$GITHUB_SHA"
          fi

      - name: Anahtar zincirini temizle
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
